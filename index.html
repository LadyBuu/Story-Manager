<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151214">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Story Organiser">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Story Organiser</title>
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
/* Layout: a manuscript ledger. Project rail, ordered list with folio numbers, detail card.
   On phones it collapses to one pane with bottom tabs and the detail opens full screen. */
:root{
  --bg:#151214; --surface:#1d1719; --surface-2:#261e22; --line:#33292e; --line-strong:#4a3c43;
  --fg:#efe6e8; --fg-2:#ad9fa5; --fg-3:#8a7c83;
  --accent:#c9809a; --accent-fg:#1a1013; --accent-soft:rgba(201,128,154,.15);
  --ok:#8fb59a; --bad:#d9808a;
  --st-idea:#8a7c83; --st-outlined:#9d93bd; --st-draft:#d1a35f; --st-revised:#c9809a; --st-final:#8fb59a;
  --scrim:rgba(8,4,6,.62);
  --v-au:#86a9d6; --v-alt:#a3a0c8;
  --r-a:#c9809a; --r-b:#7fa3d1; --r-c:#8fb59a; --r-d:#d1a35f; --r-e:#a995d1; --r-f:#d18f7f;
  --f-display:'Newsreader',Georgia,'Times New Roman',serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f7f2f3; --surface:#fffdfd; --surface-2:#f1e9eb; --line:#e5d9dd; --line-strong:#cdbcc3;
    --fg:#2a2226; --fg-2:#66575e; --fg-3:#7b6c73;
    --accent:#a24b6b; --accent-fg:#ffffff; --accent-soft:rgba(162,75,107,.10);
    --ok:#3f7a55; --bad:#b0414f;
    --st-idea:#7b6c73; --st-outlined:#6f6395; --st-draft:#9a6b1c; --st-revised:#a24b6b; --st-final:#3f7a55;
    --scrim:rgba(30,16,22,.42);
    --v-au:#3b67a0; --v-alt:#5d5a8c;
    --r-a:#a24b6b; --r-b:#3b67a0; --r-c:#3f7a55; --r-d:#9a6b1c; --r-e:#6f5aa6; --r-f:#a8553f;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f7f2f3; --surface:#fffdfd; --surface-2:#f1e9eb; --line:#e5d9dd; --line-strong:#cdbcc3;
  --fg:#2a2226; --fg-2:#66575e; --fg-3:#7b6c73;
  --accent:#a24b6b; --accent-fg:#ffffff; --accent-soft:rgba(162,75,107,.10);
  --ok:#3f7a55; --bad:#b0414f;
  --st-idea:#7b6c73; --st-outlined:#6f6395; --st-draft:#9a6b1c; --st-revised:#a24b6b; --st-final:#3f7a55;
  --scrim:rgba(30,16,22,.42);
    --v-au:#3b67a0; --v-alt:#5d5a8c;
    --r-a:#a24b6b; --r-b:#3b67a0; --r-c:#3f7a55; --r-d:#9a6b1c; --r-e:#6f5aa6; --r-f:#a8553f;
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-block:0;padding-inline:16px;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,dl,dd{margin:0}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:8px;padding-block:12px;min-width:0}
.proj{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;min-width:0;color:var(--fg)}
.proj .pn{font:500 20px/1.2 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .ic{color:var(--fg-3)}
.spacer{flex:1}
.icb{display:grid;place-items:center;width:40px;height:40px;background:none;border:1px solid transparent;border-radius:8px;color:var(--fg-2)}
.icb:hover{background:var(--surface-2);color:var(--fg)}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px;color:var(--fg-2);font-size:13px}

.body{flex:1;min-height:0;display:grid;grid-template-columns:184px minmax(0,1fr) minmax(340px,440px);gap:16px;padding-bottom:16px}
.rail{display:flex;flex-direction:column;gap:2px;min-height:0}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;background:none;border:0;border-radius:8px;color:var(--fg-2);text-align:left}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.nav[aria-current="page"] .ic{color:var(--accent)}
.nav .c{margin-left:auto;font:400 12px var(--f-mono);color:var(--fg-3)}
.sync{margin-top:auto;padding:10px;font-size:12px;color:var(--fg-3);display:flex;gap:8px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.sync.local i{background:var(--st-draft)}

.list,.detail{overflow:auto;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.lhead{padding:16px 16px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.ltitle{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.ltitle h1{font:500 24px/1.2 var(--f-display)}
.cnt{font:400 12px var(--f-mono);color:var(--fg-3)}
.lact{display:flex;gap:8px;flex-wrap:wrap}
.sbwrap{padding:4px 16px 12px}
.sbar{display:flex;height:6px;gap:2px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:block;min-width:4px;background:var(--st)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font:400 11.5px var(--f-mono);color:var(--fg-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i,.pip{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st)}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
.filters .in{flex:1 1 130px;min-width:0}
.grp{position:sticky;top:0;z-index:1;background:var(--surface);padding:10px 16px 6px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;gap:8px;align-items:center;padding:12px 16px 12px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.row.plain{grid-template-columns:minmax(0,1fr) auto;padding-left:16px}
.row.nohandle{grid-template-columns:40px minmax(0,1fr) auto;padding-left:16px}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row.dragging{opacity:.45}
.row.drop-above{box-shadow:inset 0 2px 0 var(--accent)}
.row.drop-end{box-shadow:inset 0 -2px 0 var(--accent)}
.handle{display:grid;place-items:center;width:28px;height:36px;background:none;border:0;border-radius:6px;color:var(--fg-3);touch-action:none;cursor:grab}
.handle:hover{color:var(--fg);background:var(--surface-2)}
.folio{font-family:var(--f-mono);text-align:right;line-height:1.15;font-variant-numeric:tabular-nums}
.folio b{display:block;font-size:15px;font-weight:500}
.folio i{display:block;font-style:normal;font-size:10.5px;color:var(--fg-3)}
.folio i.shift{color:var(--accent)}
.rb{min-width:0}
.rt{font:500 16.5px/1.3 var(--f-display);overflow-wrap:anywhere}
.rm{font-size:12.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rx{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px}
.tg{font-size:11.5px;color:var(--fg-3)}
.nb{font:400 11px var(--f-mono);color:var(--accent)}
.stl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-2)}
.num{font:400 13px var(--f-mono);color:var(--fg-3);text-align:right}
.hint{color:var(--fg-3);font-size:13px}

.detail-in{padding:0 16px 32px}
.dbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--surface);border-bottom:1px solid var(--line);margin-bottom:14px}
.dbar .crumb{margin-right:auto;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.back{display:none;align-items:center;gap:4px;background:none;border:0;padding:6px 8px 6px 0;color:var(--fg-2)}
.title-in{width:100%;background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;font:500 26px/1.25 var(--f-display);color:var(--fg);margin-bottom:12px}
.title-in:hover{border-bottom-color:var(--line)}
.title-in:focus{outline:none;border-bottom-color:var(--accent)}
.empty-detail{padding:48px 24px;color:var(--fg-3);font:italic 400 18px/1.4 var(--f-display)}
.sec{padding-block:14px;border-top:1px solid var(--line);margin-top:14px}
.sec h3,.lab{display:block;margin-bottom:6px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.span2{grid-column:1/-1}
.in{width:100%;min-height:38px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.in:focus{outline:none;border-color:var(--accent)}
textarea.in{min-height:88px;resize:vertical;line-height:1.5}
.mono{font-family:var(--f-mono)}
.openrow{display:flex;gap:8px;margin:14px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:7px 14px;background:transparent;border:1px solid var(--line-strong);border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--fg-2)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:12.5px}
.btn.wide{flex:1}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:36px;padding:6px 4px;background:transparent;border:0;border-right:1px solid var(--line);font-size:12.5px;color:var(--fg-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;padding:2px 4px 2px 11px;border-radius:999px;background:var(--accent-soft);font-size:12.5px}
.chip button{background:none;border:0;padding:0;color:inherit;text-align:left}
.chip .x{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--fg-3)}
.chip .x:hover{background:var(--surface-2);color:var(--fg)}
.chip.mut{background:var(--surface-2)}
.note{display:grid;grid-template-columns:30px minmax(0,1fr) 28px;gap:6px;align-items:start;padding:6px 0}
.ns{display:grid;place-items:center;width:30px;height:30px;margin-top:2px;background:none;border:0;border-radius:6px;color:var(--fg-2)}
.note.doing .ns{color:var(--st-draft)}
.note.done .ns{color:var(--ok)}
.note.done .nin{text-decoration:line-through;color:var(--fg-3)}
.nin{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 0;min-height:34px}
.nin:focus{outline:none;border-bottom-color:var(--accent)}
.nsel{margin-top:4px;max-width:100%;padding:3px 6px;font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--fg-2)}
.nx{display:grid;place-items:center;width:28px;height:30px;margin-top:2px;background:none;border:0;border-radius:6px;color:var(--fg-3)}
.nx:hover{color:var(--bad)}
.nkind{margin:12px 0 2px;font-size:12.5px;font-weight:600;color:var(--fg-2)}
.addrow{display:flex;gap:8px;margin-top:6px}
.ht .hl{display:flex;gap:8px;align-items:baseline;padding:3px 0 3px calc((var(--lv) - 1) * 16px)}
.hlab{flex:none;font:400 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);min-width:64px}
.hl span.t{overflow-wrap:anywhere}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin-bottom:10px;font-size:13px}
.meta dt{color:var(--fg-3)}
.meta dd{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.links{display:flex;flex-direction:column}
.lk{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:baseline;width:100%;padding:7px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.lk:hover .lkt{color:var(--accent)}
.lk .n{font:400 12px var(--f-mono);color:var(--fg-3);text-align:right}
.lkt{font:500 15px/1.3 var(--f-display)}
.lk small{display:block;font:400 12px var(--f-body);color:var(--fg-3)}
.barrow{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 28px;gap:10px;align-items:center;padding:3px 0;font-size:12.5px}
.barrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.barrow em{display:block;height:6px;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.barrow em i{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--accent);border-radius:3px}
.barrow b{font:400 12px var(--f-mono);text-align:right}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 4px}
.stats div{font:400 11px var(--f-body);color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em}
.stats b{display:block;font:500 22px/1.1 var(--f-mono);color:var(--fg);letter-spacing:0}
.relrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.relrow .l{margin-left:auto;color:var(--fg-2);font-size:13px}
.relform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-top:10px}

.empty{padding:36px 20px 40px;max-width:46ch}
.empty h1{font:500 30px/1.15 var(--f-display);margin-bottom:12px}
.empty p{color:var(--fg-2);margin-bottom:10px}
.empty-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}

.tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;padding:6px 0;background:none;border:0;border-radius:8px;font-size:11px;color:var(--fg-2)}
.tab[aria-current="page"]{color:var(--accent)}

.vtag{display:inline-block;font:500 10.5px/1.5 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:0 6px;border-radius:4px;border:1px solid currentColor}
.vtag.au{color:var(--v-au)}
.vtag.alternate{color:var(--v-alt)}
.ktag{font:400 11px var(--f-mono);color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em}
.rtag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--fg-2)}
.rtag i{width:7px;height:7px;border-radius:50%;background:var(--rc)}
.row.trashed{opacity:.62}
.row.trashed .rt{text-decoration:line-through}
.routes{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:thin}
.rtab{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:3px 12px;border:1px solid var(--line-strong);border-radius:999px;background:transparent;font-size:12.5px;color:var(--fg-2)}
.rtab i{width:8px;height:8px;border-radius:50%;background:var(--rc)}
.rtab[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600;border-color:var(--accent)}
.rtree .rn{display:flex;align-items:center;gap:8px;padding:10px 0 10px calc(var(--d,0) * 18px);border-bottom:1px solid var(--line)}
.rdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--rc)}
.rnb{flex:1;min-width:0}
.rnb b{display:block;font:500 16px/1.3 var(--f-display);overflow-wrap:anywhere}
.rnb small{color:var(--fg-3);font-size:12px}
.redit{padding:8px 0 14px calc(var(--d,0) * 18px);border-bottom:1px solid var(--line)}
.imp{border-bottom:1px solid var(--line)}
.imp .chk{border-bottom:0}
.impsel{display:flex;gap:8px;padding:0 0 10px 27px}
.impsel .in{flex:1;min-width:0}
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:min(580px,100%);max-height:90%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:500 22px/1.2 var(--f-display);margin-bottom:12px}
.sheet .sec:first-of-type{margin-top:6px}
.sheet p{margin-bottom:10px;color:var(--fg-2)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk b{font-weight:500;overflow-wrap:anywhere}
.chk small{display:block;color:var(--fg-3);font-size:12px}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.pickrow .ic{color:var(--accent);visibility:hidden}
.pickrow.on .ic{visibility:visible}
.pickrow:hover{background:var(--surface-2)}
.projrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.projrow .btn{flex:1;justify-content:flex-start;border-color:transparent;font:500 17px var(--f-display)}
.projrow .btn[aria-current="true"]{background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;max-width:min(92vw,420px);padding:10px 16px;background:var(--fg);color:var(--bg);border-radius:8px;font-size:13px}
.toast[hidden]{display:none}
.toast button{margin-left:14px;padding:2px 4px;background:none;border:0;color:var(--bg);font-weight:600;text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (min-width:600px){
  .scrim{align-items:center}
  .sheet{border-radius:14px}
  .toast{bottom:24px}
}
@media (max-width:959px){
  .body{grid-template-columns:minmax(0,1fr);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .rail{display:none}
  .tabs{display:flex}
  .detail{display:none}
  .app.has-sel .detail{display:block;position:fixed;inset:0;z-index:30;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .back{display:inline-flex}
  .detail-in{padding-inline:16px}
}
@media (max-width:420px){
  .relform{grid-template-columns:minmax(0,1fr)}
  .row{padding-right:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.chap{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--surface)}
.chap>summary{cursor:pointer;padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;list-style:none}
.chap>summary::-webkit-details-marker{display:none}
.chap>summary::before{content:'\25B8';color:var(--fg-3)}

(function(){

  pid:null,view:'documents',sel:null,seg:'chron',filter:{status:'',arc:'',tag:'',q:''},

/* ---------- helpers ---------- */

var uid=function(){return 'i'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)};
var P=function(c){return S[c].filter(function(x){return x.pid===S.pid})};
var byId=function(c,id){return S[c].find(function(x){return x.id===id})};
var sortBy=function(a,k){return a.slice().sort(function(x,y){return (x[k]==null?0:x[k])-(y[k]==null?0:y[k])})};
var MAGIC=['earth','water','fire','air','metal','wood','blood','bone','mind','morphic','life','death','space','time','dimension','void','reality','transference'];
var STATK=['str','dex','con','int','wis','cha'];
var PERS=[['traits','Traits'],['ideals','Ideals'],['bonds','Bonds'],['flaws','Flaws'],['alignment','Alignment'],['likes','Likes'],['dislikes','Dislikes'],['habits','Habits'],['fears','Fears'],['goals','Goals'],['authority','Attitude to authority'],['conflictStyle','Conflict style'],['socialStyle','Social style'],['quirks','Quirks']];
function normChar(c){

  [c.weapons,c.previousNames,c.specialMoves.physical,c.specialMoves.magical].forEach(function(a){a.forEach(function(x){if(!x.id)x.id='a'+uid()})});

}
function getPath(o,path){var p=path.split('.'),t=o;for(var i=0;i<p.length;i++){if(t==null)return undefined;t=t[p[i]]}return t}
function showAv(){try{return localStorage.getItem('so-av')==='1'}catch(e){return false}}

var nameOf=function(c,id){var o=byId(c,id);return o?(o.name||o.title||''):''};

var maxOf=function(a,k){return a.reduce(function(m,x){return Math.max(m,x[k]||0)},0)};
var rootId=function(){return 'root-'+S.pid};

function chainOf(rid){
  var out=[],seen={},id=rid||rootId();
  while(id&&!seen[id]){seen[id]=1;out.unshift(id);var r=byId('routes',id);id=r?r.parentId:null}
  if(out[0]!==rootId())out.unshift(rootId());
  return out;
}
function curRoute(){var r=byId('routes',S.rid);return (r&&r.pid===S.pid)?r:(byId('routes',rootId())||null)}
function selRoutes(){
  var prim=(curRoute()||{}).id, ids=(S.rids||[]).filter(function(id){var r=byId('routes',id);return r&&r.pid===S.pid});
  if(prim&&ids.indexOf(prim)<0)ids.unshift(prim);
  return ids.length?ids:(prim?[prim]:[]);
}
function inChain(){var m={};selRoutes().forEach(function(r){chainOf(r).forEach(function(x){m[x]=1})});return m}
function eff(c){
  var all=P(c);
  if(c!=='documents'&&c!=='events'&&c!=='arcs')return all;
  var m=inChain(), out=all.filter(function(o){return m[routeOf(o)]&&!isTrashed(o)});
  if(c==='documents'){var sup={};out.forEach(function(o){if(o.divergesFrom)sup[o.divergesFrom]=1});out=out.filter(function(o){return !sup[o.id]})}
  return out;
}
function visOk(o){var v=o.variant||'canon',s=S.vis;if(s==='trash')return v==='trashed';if(s==='all')return v!=='trashed';return v===s}
var posMap=function(c,k){var m={};sortBy(eff(c),k).forEach(function(x,i){m[x.id]=i+1});return m};
function kindOf(d){var k=d&&d.kind;return (!k||k==='chapter'||k==='scene')?'draft':k}
function kindLabel(k){k=(!k||k==='chapter'||k==='scene')?'draft':k;var x=KINDS.find(function(y){return y[0]===k});return x?x[1]:'Draft'}

/* chapters live inside a file: the headings at the chapter level carry the story data */
var MONTHS={january:1,jan:1,february:2,feb:2,march:3,mar:3,april:4,apr:4,may:5,june:6,jun:6,july:7,jul:7,august:8,aug:8,september:9,sep:9,sept:9,october:10,oct:10,november:11,nov:11,december:12,dec:12};
function autoKey(text){
  var t=(text||'').trim().toLowerCase().replace(/[,.]/g,' ').replace(/\s+/g,' ').trim(), m, y, mo=0, da=0;
  if(!t)return null;
  if((m=/^(\d{3,4})-(\d{1,2})-(\d{1,2})$/.exec(t))){y=+m[1];mo=+m[2];da=+m[3]}
  else if((m=/^(\d{1,2})(?:st|nd|rd|th)? (?:of )?([a-z]+) (\d{3,4})$/.exec(t))&&MONTHS[m[2]]){da=+m[1];mo=MONTHS[m[2]];y=+m[3]}
  else if((m=/^([a-z]+) (\d{1,2})(?:st|nd|rd|th)? (\d{3,4})$/.exec(t))&&MONTHS[m[1]]){mo=MONTHS[m[1]];da=+m[2];y=+m[3]}
  else if((m=/^([a-z]+) (\d{3,4})$/.exec(t))&&MONTHS[m[1]]){mo=MONTHS[m[1]];y=+m[2]}
  else if((m=/^(\d{3,4})$/.exec(t))){y=+m[1]}
  else return null;
  if(mo>12||da>31)return null;
  return y*10000+mo*100+da;
}
function dateMode(){var p=proj();return (p&&p.dateMode)||'auto'}
function itemKey(x){
  if(dateMode()==='manual'){var k=x.dateKey;return (k===''||k==null||isNaN(+k))?null:+k}
  return autoKey(x.storyDate);
}
function chapArc(d,x){return x.arcId||d.arcId||''}
function docArcs(d){return uniq([d.arcId].concat(chapters(d).map(function(x){return x.arcId})))}
function chapWords(d,x){var hs=d.headings||[],i=hs.indexOf(x);if(i<0||x.words==null)return null;var t=x.words||0;for(var j=i+1;j<hs.length&&hs[j].level>x.level;j++)t+=hs[j].words||0;return t}
function arcWords(a){
  var t=0;
  P('documents').filter(function(d){return !isTrashed(d)}).forEach(function(d){
    var chs=chapters(d);
    if(chs.some(function(x){return x.words!=null}))chs.forEach(function(x){if(chapArc(d,x)===a.id){var w=chapWords(d,x);if(w!=null)t+=w}});
    else if(d.arcId===a.id)t+=(d.file&&d.file.words)||0;
  });
  return t;
}
function chapCount(d,id,kind){return chapters(d).filter(function(x){return kind==='char'?((x.characterIds||[]).indexOf(id)>-1||x.pov===id):(x.locationIds||[]).indexOf(id)>-1}).length}
function docSub(d,id,kind){var tot=chapters(d).length;if(!tot)return docSpan(d);var n=chapCount(d,id,kind);return [n?(n+' of '+tot+' chapters'):'whole file',docSpan(d)].filter(Boolean).join(' · ')}
function chronItems(){
  var out=[];
  eff('documents').filter(function(d){return kindOf(d)==='draft'}).forEach(function(d){
    var dk=itemKey(d), chs=chapters(d);
    if(!chs.length){out.push({d:d,h:null,key:dk,ord:0});return}
    chs.forEach(function(x,i){var k=itemKey(x);out.push({d:d,h:x,key:k!=null?k:dk,ord:i})});
  });
  out.sort(function(a,b){
    var ka=a.key,kb=b.key,tie=((a.d.chron||0)-(b.d.chron||0))||(a.ord-b.ord);
    if(ka==null&&kb==null)return tie;
    if(ka==null)return 1;if(kb==null)return -1;
    return (ka-kb)||tie;
  });
  return out;
}
function chapLvl(d){
  var p=proj(),want=parseInt(p&&p.chapterLevel,10)||2,hs=(d&&d.headings)||[];
  if(!hs.length)return 0;
  if(hs.some(function(x){return x.level===want}))return want;
  return Math.min.apply(null,hs.map(function(x){return x.level}));
}
function ensureHeads(d){(d.headings||[]).forEach(function(x){if(!x.id)x.id='h'+uid()})}
function chapters(d){var l=chapLvl(d);ensureHeads(d);return (d.headings||[]).filter(function(x){return x.level===l})}
function uniq(a){var s={};return a.filter(function(x){if(!x||s[x])return false;s[x]=1;return true})}
function docChars(d){var a=(d.characterIds||[]).slice();chapters(d).forEach(function(x){(x.characterIds||[]).forEach(function(i){a.push(i)});if(x.pov)a.push(x.pov)});return uniq(a)}
function docLocs(d){var a=(d.locationIds||[]).slice();chapters(d).forEach(function(x){(x.locationIds||[]).forEach(function(i){a.push(i)})});return uniq(a)}
function docPovs(d){var a=[];if(d.pov)a.push(d.pov);chapters(d).forEach(function(x){if(x.pov)a.push(x.pov)});return uniq(a)}
function docSpan(d){
  var ds=chapters(d).map(function(x){return (x.storyDate||'').trim()}).filter(Boolean);
  if(!ds.length)return (d.storyDate||'').trim();
  return ds[0]===ds[ds.length-1]?ds[0]:ds[0]+' to '+ds[ds.length-1];
}
function mergeHeads(old,nu){
  old=old||[];var used={};
  return nu.map(function(x,i){
    var j=-1;
    for(var k=0;k<old.length;k++){if(!used[k]&&old[k].level===x.level&&(old[k].title||'').toLowerCase()===(x.title||'').toLowerCase()){j=k;break}}
    if(j<0&&old.length===nu.length&&!used[i]&&old[i].level===x.level)j=i;
    if(j<0)return x;
    used[j]=1;return Object.assign({},old[j],{level:x.level,title:x.title,words:x.words});
  });
}
function variantLabel(v){v=v||'canon';if(v==='trashed')return 'Trashed';var x=VARIANTS.find(function(y){return y[0]===v});return x?x[1]:'Canon'}
function stable(v){return JSON.stringify(v,function(k,x){if(x&&typeof x==='object'&&!Array.isArray(x)){var o={};Object.keys(x).sort().forEach(function(y){o[y]=x[y]});return o}return x})}
function snap(){var o={};COLLS.forEach(function(c){if(c==='projects')return;o[c]=S[c].filter(function(x){return x.pid===S.pid}).map(function(x){return stable(x)})});return {pid:S.pid,d:o}}
function pushUndo(label,u){undoStack.push({label:label,u:u});if(undoStack.length>20)undoStack.shift()}
function undo(){
  var e=undoStack.pop();if(!e){toast('Nothing to undo.');return}
  if(e.u.pid!==S.pid){toast('That change was in another project.');return}
  withBulk(function(){COLLS.forEach(function(c){
    if(c==='projects')return;
    var before=e.u.d[c]||[], ids={};
    before.forEach(function(js){
      var o=JSON.parse(js);ids[o.id]=1;var cur=byId(c,o.id);
      if(!cur){S[c].push(o);save(c,o,true)}
      else if(stable(cur)!==js){S[c][S[c].indexOf(cur)]=o;save(c,o,true)}
    });
    S[c].filter(function(x){return x.pid===S.pid&&!ids[x.id]}).forEach(function(x){dropDoc(c,x.id)});
  })});
  render();toast('Undone: '+e.label);
}

function ic(n,sz){sz=sz||18;return '<svg class="ic" width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>'}

/* ---------- persistence ---------- */
var pending={}, chains={}, bulk=0, bulkLocal=0;
function withBulk(fn){bulk++;try{return fn()}finally{bulk--;if(!bulk&&bulkLocal){bulkLocal=0;persistLocal()}}}
function key(c,id){return c+'/'+id}
function save(coll,obj,now){
  if(bulk&&S.mode!=='cloud'){bulkLocal=1;return}
  var k=key(coll,obj.id);
  clearTimeout(pending[k]);
  pending[k]=setTimeout(function(){flush(coll,obj.id)},now?0:350);
}
function flush(coll,id){
  var k=key(coll,id); delete pending[k];
  if(S.mode!=='cloud'){persistLocal();return}
  var cur=byId(coll,id); if(!cur)return;
  var body=JSON.parse(JSON.stringify(cur));
  var prev=chains[k]||Promise.resolve();
  chains[k]=prev.then(function(){return db.collection(coll).doc(id).set(body)}).catch(writeFailed);
}
function dropDoc(coll,id){
  var k=key(coll,id); clearTimeout(pending[k]); delete pending[k];
  S[coll]=S[coll].filter(function(x){return x.id!==id});
  if(S.mode!=='cloud'){persistLocal();return}
  var prev=chains[k]||Promise.resolve();
  chains[k]=prev.then(function(){return db.collection(coll).doc(id).delete()}).catch(writeFailed);
}
function writeFailed(e){
  var c=e&&e.code;
  toast(c==='quota_exceeded'?'Storage is full. Export a backup and delete something you no longer need.':'A change could not be saved. Check your connection and try again.');
}
function cacheLocal(){try{var o={};COLLS.forEach(function(c){o[c]=S[c]});localStorage.setItem('story-organiser-v1',JSON.stringify(o))}catch(e){}}
function persistLocal(){if(bulk){bulkLocal=1;return}cacheLocal();if(S.mode==='od')odSchedule()}
function loadLocal(){try{var o=JSON.parse(localStorage.getItem('story-organiser-v1')||'null');if(o)COLLS.forEach(function(c){S[c]=o[c]||[]})}catch(e){}}
function mk(coll,props){var o=Object.assign({id:uid(),pid:S.pid},props);S[coll].push(o);save(coll,o,true);return o}

function subscribe(){
  COLLS.forEach(function(c,i){
    var first=true;
    db.collection(c).onSnapshot(function(snap){
      var next=snap.docs.map(function(d){
        var k=key(c,d.id);
        if(pending[k]){var l=byId(c,d.id);if(l)return l}
        return Object.assign({},d.data(),{id:d.id});
      });
      S[c].forEach(function(l){if(pending[key(c,l.id)]&&!next.some(function(x){return x.id===l.id}))next.push(l)});
      S[c]=next;
      if(first){first=false;S.loaded|=(1<<i);if(S.loaded===(1<<COLLS.length)-1)afterLoad()}
      scheduleRender();
    },function(){
      S.banner='Live sync stopped for this view. Reload the page to reconnect.';
      render();
    });
  });
}
function afterLoad(){
  S.mode='cloud';ensureRoutes();
  var want='';try{want=localStorage.getItem('so-pid')||''}catch(e){}
  S.pid=(byId('projects',want)||S.projects[0]||{}).id||null;
  render();
}

/* ---------- theme ---------- */
function applyTheme(t){
  var r=document.documentElement;
  if(t==='dark'||t==='light')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
  try{localStorage.setItem('so-theme',t)}catch(e){}
}
function curTheme(){var t='system';try{t=localStorage.getItem('so-theme')||'system'}catch(e){}return t}

/* ---------- render scheduling ---------- */
var deferred=false;
function editing(){var a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#app').contains(a))}
function scheduleRender(){if(editing()){deferred=true;return}render()}
document.addEventListener('focusout',function(){
  if(!deferred)return;
  setTimeout(function(){if(!editing()){deferred=false;render()}},60);
});

function render(){
  if(S.sel&&!selObj())S.sel=null;
  $('#app').classList.toggle('has-sel',!!S.sel);
  renderTop();renderBanner();renderRail();renderList();renderDetail();
}
function selObj(){
  if(!S.sel)return null;
  var c=S.view==='documents'?'documents':S.view==='characters'?'characters':S.view==='locations'?'locations':S.view==='arcs'?'arcs':(S.seg==='events'?'events':'documents');
  return byId(c,S.sel);
}
function selColl(){return S.view==='documents'?'documents':S.view==='characters'?'characters':S.view==='locations'?'locations':S.view==='arcs'?'arcs':(S.seg==='events'?'events':'documents')}

function entTags(o){
  var v=o.variant&&o.variant!=='canon'&&o.variant!=='trashed'?'<span class="vtag '+o.variant+'">'+esc(variantLabel(o.variant))+'</span>':'';
  var rid=routeOf(o), c=byId('routes',rid);
  var rt=(rid!==rootId()&&c)?'<span class="rtag" style="--rc:var(--r-'+(c.color||'a')+')"><i></i>'+esc(c.name)+'</span>':'';
  return (v||rt)?'<div class="rx">'+v+rt+'</div>':'';
}
function visSel(){
  return '<select class="in" data-vis aria-label="Variant filter">'+[['all','All variants'],['canon','Canon only'],['au','AU only'],['alternate','Alternate only'],['trash','Trash']].map(function(x){return '<option value="'+x[0]+'"'+(S.vis===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select>';
}
function routeList(){
  var rs=P('routes'), out=[];
  function walk(pid,d){sortBy(rs.filter(function(r){return r.parentId===pid}),'order').forEach(function(r){out.push({r:r,d:d});walk(r.id,d+1)})}
  var root=byId('routes',rootId());
  if(root){out.push({r:root,d:0});walk(root.id,1)}
  rs.forEach(function(r){if(!out.some(function(x){return x.r.id===r.id}))out.push({r:r,d:1})});
  return out;
}
function routeBar(){
  var rs=routeList();if(rs.length<2)return '';
  var sel=selRoutes();
  return '<div class="routes" role="group" aria-label="Routes shown. Tap to add or remove a route. Double-click to show only one.">'+rs.map(function(x){
    return '<button class="rtab" data-act="route" data-id="'+x.r.id+'" aria-pressed="'+(sel.indexOf(x.r.id)>-1)+'" style="--rc:var(--r-'+(x.r.color||'a')+')"><i></i>'+esc(x.r.name)+'</button>';
  }).join('')+'<button class="rtab" data-act="route-all" aria-pressed="'+(sel.length===rs.length)+'">All</button></div>';
}
function docRow(d,o){
  var pvs=docPovs(d), pov=nameOf('characters',pvs[0])+(pvs.length>1?' +'+(pvs.length-1):'');
  var locs=docLocs(d).map(function(id){return nameOf('locations',id)}).filter(Boolean);
  var meta=[docSpan(d),pov&&('POV '+pov),locs[0]&&(locs[0]+(locs.length>1?' +'+(locs.length-1):''))].filter(Boolean).join(' · ');
  var open=(d.notes||[]).filter(function(n){return n.state!=='done'}).length;
  var tags=(d.tags||[]).slice(0,3).map(function(t){return '<span class="tg">#'+esc(t)+'</span>'}).join('');
  var st=d.status||'Idea';
  var kind=(kindOf(d)!=='draft')?'<span class="ktag">'+esc(kindLabel(d.kind))+'</span>':'';
  var vr=(d.variant&&d.variant!=='canon'&&d.variant!=='trashed')?'<span class="vtag '+d.variant+'">'+esc(variantLabel(d.variant))+'</span>':'';
  var rid=routeOf(d), rc=byId('routes',rid);
  var rt=(rid!==rootId()&&rc)?'<span class="rtag" style="--rc:var(--r-'+(rc.color||'a')+')"><i></i>'+esc(rc.name)+'</span>':'';
  var chg=(d.file&&d.file.stale)?'<span class="chg">changed</span>':'';
  var extra=chg+kind+vr+rt+tags+(open?'<span class="nb">'+open+' open</span>':'');
  return '<div class="row'+(o.sortable?'':' nohandle')+(S.sel===d.id?' sel':'')+(isTrashed(d)?' trashed':'')+'" role="listitem" tabindex="0" data-act="select" data-id="'+d.id+'">'+
    (o.sortable?'<button class="handle" data-handle aria-label="Reorder '+esc(d.title)+'. Use arrow keys or drag.">'+ic('grip',16)+'</button>':'')+
    '<div class="folio"><b>'+pad(o.n)+'</b>'+(o.sub||'')+'</div>'+
    '<div class="rb"><div class="rt">'+(esc(d.title)||'Untitled')+'</div>'+(meta?'<div class="rm">'+esc(meta)+'</div>':'')+(extra?'<div class="rx">'+extra+'</div>':'')+'</div>'+
    '<span class="stl"><i class="pip" style="--st:var(--st-'+st.toLowerCase()+')"></i>'+esc(st)+'</span></div>';
}
function hay(d){return [d.title,d.file&&d.file.name,d.storyDate,kindLabel(d.kind),variantLabel(d.variant),nameOf('routes',routeOf(d))].concat((d.headings||[]).map(function(h){return h.title})).join(' ').toLowerCase()}

function renderModal(){

  else if(m.type==='picker')inner='<h2>'+esc(pickerSpec.title)+'</h2><input class="in" id="pickIn" data-input="pick" data-enter="pick-create" placeholder="'+(pickerSpec.create?'Filter, or type a new name and press Enter':'Filter')+'" aria-label="Filter"><div id="pickList" style="margin-top:8px">'+pickRows('')+'</div><div class="actions"><button class="btn primary" data-act="close">Done</button></div>';
  else if(m.type==='routes')inner=routesModal();
  else if(m.type==='odpick')inner=odPickModal();
  else if(m.type==='clear')inner=clearModal();
  else if(m.type==='hollow')inner=hollowModal();
  else if(m.type==='routedel')inner=routeDelModal();

  box.innerHTML='<div class="scrim" data-act="scrim" role="dialog" aria-modal="true"><div class="sheet">'+inner+'</div></div>';

  if(f)setTimeout(function(){var e=$(f);if(e){e.focus();if(e.select)e.select()}},30);
}

function searchResults(q){
  q=(q||'').trim().toLowerCase();
  if(!q)return '<p class="hint">Search across documents, headings, notes, characters, locations, events and arcs.</p>';
  var out=[];
  P('documents').forEach(function(d){
    var hs=(d.headings||[]).filter(function(x){return x.title.toLowerCase().indexOf(q)>-1});
    var ns=(d.notes||[]).filter(function(x){return (x.text||'').toLowerCase().indexOf(q)>-1});
    if((d.title||'').toLowerCase().indexOf(q)>-1||(d.storyDate||'').toLowerCase().indexOf(q)>-1||kindLabel(d.kind).toLowerCase().indexOf(q)>-1||variantLabel(d.variant).toLowerCase().indexOf(q)>-1||(nameOf('routes',routeOf(d))||'').toLowerCase().indexOf(q)>-1||(d.tags||[]).some(function(t){return t.indexOf(q)>-1})||hs.length||ns.length)
      out.push({t:'Document',v:'documents',s:'',id:d.id,title:d.title,sub:hs[0]?'Heading: '+hs[0].title:ns[0]?'Note: '+ns[0].text:''});
  });
  P('documents').forEach(function(d){chapters(d).forEach(function(x){
    if(((x.title||'')+' '+(x.summary||'')+' '+(x.storyDate||'')).toLowerCase().indexOf(q)>-1)out.push({t:'Chapter',v:'documents',s:'',a:'chap-go',hid:x.id,id:d.id,title:x.title,sub:[d.title,x.storyDate].filter(Boolean).join(' · ')});
  })});
  P('characters').forEach(function(c){if(charHay(c).indexOf(q)>-1)out.push({t:'Character',v:'characters',s:'',id:c.id,title:c.name,sub:c.role})});
  P('locations').forEach(function(c){if((c.name||'').toLowerCase().indexOf(q)>-1)out.push({t:'Location',v:'locations',s:'',id:c.id,title:c.name,sub:c.type})});
  P('events').forEach(function(c){if((c.title||'').toLowerCase().indexOf(q)>-1||(c.dateText||'').toLowerCase().indexOf(q)>-1)out.push({t:'Event',v:'timeline',s:'events',id:c.id,title:c.title,sub:c.dateText})});
  P('arcs').forEach(function(c){if((c.name||'').toLowerCase().indexOf(q)>-1)out.push({t:'Arc',v:'arcs',s:'',id:c.id,title:c.name,sub:''}) });
  if(!out.length)return '<p class="hint">Nothing matches that.</p>';

var W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
function lvlOfStyle(id,styles){
  for(var i=0;i<8&&id;i++){
    var s=styles[id];if(!s)return 0;
    var m=/^heading\s*([1-9])$/i.exec(s.name);if(m)return +m[1];
    if(s.outline!=null&&s.outline<9)return s.outline+1;
    id=s.based;
  }
  return 0;
}
async function parseDocx(file){
  if(typeof JSZip==='undefined')throw new Error('zip');
  var zip=await JSZip.loadAsync(await file.arrayBuffer());
  var docF=zip.file('word/document.xml');if(!docF)throw new Error('nodoc');
  var parse=function(s){return new DOMParser().parseFromString(s,'application/xml')};
  var styles={};
  var sf=zip.file('word/styles.xml');
  if(sf){
    var sd=parse(await sf.async('string')), sl=sd.getElementsByTagNameNS(W,'style');
    for(var i=0;i<sl.length;i++){
      var st=sl[i], id=st.getAttributeNS(W,'styleId');
      var ne=st.getElementsByTagNameNS(W,'name')[0], be=st.getElementsByTagNameNS(W,'basedOn')[0], oe=st.getElementsByTagNameNS(W,'outlineLvl')[0];
      styles[id]={name:ne?ne.getAttributeNS(W,'val'):'',based:be?be.getAttributeNS(W,'val'):'',outline:oe?parseInt(oe.getAttributeNS(W,'val'),10):null};
    }
  }
  var doc=parse(await docF.async('string')), ps=doc.getElementsByTagNameNS(W,'p');
  var heads=[], words=0, cur=null;
  for(var j=0;j<ps.length;j++){
    var p=ps[j], ts=p.getElementsByTagNameNS(W,'t'), txt='';
    for(var k=0;k<ts.length;k++)txt+=ts[k].textContent;
    txt=txt.trim();if(!txt)continue;
    var wc=txt.split(/\s+/).length;words+=wc;
    var pPr=p.getElementsByTagNameNS(W,'pPr')[0], lv=0;
    if(pPr){
      var ol=pPr.getElementsByTagNameNS(W,'outlineLvl')[0], ps2=pPr.getElementsByTagNameNS(W,'pStyle')[0];
      if(ol){var v=parseInt(ol.getAttributeNS(W,'val'),10);lv=v<9?v+1:0}
      else if(ps2)lv=lvlOfStyle(ps2.getAttributeNS(W,'val'),styles);
    }
    if(lv>0){cur={level:lv,title:txt.slice(0,200),words:wc};heads.push(cur)}else if(cur)cur.words+=wc;
  }

  var cf=zip.file('docProps/core.xml');
  if(cf){var cx=await cf.async('string');var mm=/<dcterms:modified[^>]*>([^<]+)</.exec(cx);if(mm)modified=mm[1]}

}
async function handleFiles(fileList){

/* ---------- ordering ---------- */
function reorder(coll,k,id,newIndex){
  var items=sortBy(eff(coll),k), idx=items.findIndex(function(x){return x.id===id});
  if(idx<0)return;
  var me=items.splice(idx,1)[0];
  newIndex=Math.max(0,Math.min(items.length,newIndex));
  var prev=items[newIndex-1], next=items[newIndex], v;
  if(prev&&next)v=(prev[k]+next[k])/2;else if(prev)v=prev[k]+1;else if(next)v=next[k]-1;else v=1;
  if(prev&&next&&Math.abs(next[k]-prev[k])<1e-6){
    items.splice(newIndex,0,me);
    items.forEach(function(x,i){x[k]=i+1;save(coll,x)});
    return;
  }
  me[k]=v;save(coll,me);
}

/* folder scan and download */
async function odScan(folder){
  var out=[];
  async function walk(id,rel,depth){
    var url='/me/drive/items/'+id+'/children?$select=id,name,size,webUrl,eTag,lastModifiedDateTime,folder,file&$top=200';
    while(url){
      var r=await gfetch(url);
      if(!r.ok)throw new Error('scan '+r.status);
      var j=await r.json();
      for(var i=0;i<j.value.length;i++){
        var it=j.value[i];
        if(it.folder){if(depth<4&&it.name.charAt(0)!=='.')await walk(it.id,rel.concat(it.name),depth+1)}
        else if(/\.docx$/i.test(it.name)&&it.name.indexOf('~$')!==0)
          out.push({id:it.id,name:it.name,size:it.size,webUrl:it.webUrl,etag:it.eTag,mtime:it.lastModifiedDateTime,rel:rel});
      }
      url=j['@odata.nextLink']||null;
    }
  }
  await walk(folder.id,[],0);
  return out;
}
async function odCheck(p){
  var files=await odScan(p.odFolder), byOd={};
  files.forEach(function(f){byOd[f.id]=f});
  var docs=S.documents.filter(function(d){return d.pid===p.id&&d.file&&d.file.od});
  var linked={},changed=[];
  docs.forEach(function(d){
    var f=byOd[d.file.od.id];if(!f)return;
    linked[f.id]=1;
    var stale=f.mtime!==d.file.od.mtime;
    if(stale)changed.push(f);
    if(!!d.file.stale!==stale){d.file.stale=stale;save('documents',d,false)}
  });
  var fresh=files.filter(function(f){return !linked[f.id]});
  OD.lastCheck=Date.now();OD.scan[p.id]={files:files,changed:changed,fresh:fresh};
  return OD.scan[p.id];
}
async function odDownload(list,root,onProgress){
  var out=[],i=0,done=0,fails=0;
  async function worker(){
    while(i<list.length){
      var f=list[i++];
      try{
        var r=await gfetch('/me/drive/items/'+f.id+'/content');
        if(!r.ok)throw new Error(r.status);
        var b=await r.blob();
        var file=new File([b],f.name,{lastModified:Date.parse(f.mtime)||Date.now()});
        Object.defineProperty(file,'webkitRelativePath',{value:[root].concat(f.rel,[f.name]).join('/')});
        file._od={id:f.id,url:f.webUrl,etag:f.etag,mtime:f.mtime};
        out.push(file);
      }catch(e){fails++}
      done++;if(onProgress)onProgress(done,list.length);
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  out.fails=fails;return out;
}

  'od-up':function(){var m=S.modal;if(m.stack.length>1){m.stack.pop();odList()}},
  'od-use':function(){
    var m=S.modal,cur=m.stack[m.stack.length-1],p=proj();if(!p||cur.id==='root')return;
    if(m.target==='portraits'){
      p.portraitFolder={id:cur.id,name:cur.name};save('projects',p,true);closeModal();
      odPortraits(p).then(function(n){render();toast(n?n+' portrait'+(n>1?'s':'')+' matched.':'No images matched your character names. Name each file like the character, for example Danielle Stewart.jpg.')}).catch(function(){toast('Could not read the portraits folder.')});
      return;
    }
    p.odFolder={id:cur.id,name:cur.name,webUrl:cur.webUrl||''};
    if(cur.webUrl)p.folderUrl=cur.webUrl;
    save('projects',p,true);closeModal();odSyncNow();
  },
  'od-sync':function(){odSyncNow()},
  'od-refresh':async function(el){
    var d=byId('documents',el.dataset.id),p=proj();if(!d||!d.file||!d.file.od)return;
    odBusy('Downloading.');
    try{
      var r=await gfetch('/me/drive/items/'+d.file.od.id+'?$select=id,name,webUrl,eTag,lastModifiedDateTime');
      if(!r.ok)throw new Error(r.status);var j=await r.json();
      var fs=await odDownload([{id:j.id,name:j.name,webUrl:j.webUrl,etag:j.eTag,mtime:j.lastModifiedDateTime,rel:[]}],(p&&p.name)||'x');
      if(!fs.length)throw new Error('dl');
      await applyRefresh(d,fs[0]);
    }catch(e){closeModal();toast('Could not read that file from OneDrive.')}
  }
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')odPoll()});
window.addEventListener('online',function(){if(S.mode==='od'&&OD.state==='error')odSchedule()});

/* ---------- start ---------- */
(async function init(){
  applyTheme(curTheme());
  render();
  var ready=false;
  try{ready=await odInit()}catch(e){if(!S.banner)S.banner='Sign-in could not start: '+String((e&&e.message)||e).slice(0,160)}
  if(ready&&OD.acct){
    try{await odBoot()}catch(e){S.mode='local';S.banner='Something went wrong opening OneDrive: '+String((e&&e.message)||e).slice(0,160);render()}
  }else{
    S.mode='local';loadLocal();ensureRoutes();
    if(!S.banner){
      var c=odCfg();
      if(c.clientId&&window.msal){S.banner='Not signed in to OneDrive, so changes stay in this browser.';S.bannerAct=[{label:'Sign in',act:'od-signin'}]}
      else{S.banner='OneDrive is not connected yet, so changes stay in this browser.';S.bannerAct=[{label:'Set up',act:'settings'}]}
    }
    var want='';try{want=localStorage.getItem('so-pid')||''}catch(e){}
    S.pid=(byId('projects',want)||S.projects[0]||{}).id||null;
    render();
  }
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
})();
</script>
</body>
